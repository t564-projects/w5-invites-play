<div id="bg"></div><div id="app"></div><div id="layer"></div>
<script src="../data.js"></script><script src="../levels.js"></script><script src="../credits.js"></script>
<script>history.replaceState(null,'','?seen&unlock');</script>
<script src="../game.js"></script>
<script>
// Plays every valid itinerary of every level through the real tap handler and checks each one wins,
// then checks that a plan with a rule break does not win and explains why.
const res = [];
save.mute = true; save.seen = true;
LEVELS.forEach((L, i) => {
  let wins = 0;
  L.solutions.forEach(sol => { startLevel(i); sol.forEach((id, n) => pick(n, idxOf(id))); if (won) wins++; });
  res.push({ level: i + 1, solutions: L.solutions.length, won: wins });
});
// level 6: sleeping in Namche then straight to Dingboche on a short plan must be flagged
startLevel(5); const N = nodes();
pick(0, idxOf('phakding')); pick(1, idxOf('namche')); pick(2, idxOf('dingboche')); pick(3, idxOf('lobuche'));
res.push({ rule_break_flagged: analyse().some(d => d.probs.length) && !won, kinds: analyse().flatMap(d => d.probs.map(p => p.kind)) });
document.getElementById('out').textContent = JSON.stringify(res);
</script>
