<!doctype html><meta charset="utf-8"><body><pre id="out">running</pre>
<div id="sky"></div><div id="app"></div><div id="layer"></div>
<script src="../data.js"></script><script src="../credits.js"></script><script src="../microgames.js"></script>
<script>history.replaceState(null,'','?seen'); window.__instant = true;</script>
<script src="../game.js"></script>
<script>
// For every microgame: (1) do the task through the real code and check you survive,
// (2) do nothing and check you lose (or survive, for "survive until the time is up" games).
// Then play a whole stage automatically, and a whole stage doing nothing.
(async () => {
  const res = []; save.mute = true; save.seen = true; screen = 'play'; renderPlay();
  for (const id of Object.keys(MICRO)) {
    window.__auto = true; const a = await runMicro(id, 3);
    window.__auto = false; const b = await runMicro(id, 3);
    res.push({ id, solve_wins: a.won, idle_wins: b.won, ok: a.won === true && b.won === false });
  }
  // a stage played perfectly
  window.__auto = true; await playRound('inca', 0); await new Promise(r => setTimeout(r, 50));
  res.push({ perfect_round: save.won['inca-1'] === true, photo_overlay: !!document.querySelector('.photo'), coins: save.coins });
  // a stage played by doing nothing (should run out of lives)
  window.__auto = false; closeOverlay(); await playRound('tmb', 0); await new Promise(r => setTimeout(r, 50));
  res.push({ idle_round_game_over: !save.won['tmb-1'] && /Out of lives/.test(document.body.innerText), lives: R.lives });
  document.getElementById('out').textContent = JSON.stringify(res);
})();
</script>
