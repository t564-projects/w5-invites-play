<!doctype html><meta charset="utf-8"><body><pre id="out">running</pre>
<div id="bg"></div><div id="app"></div><div id="layer"></div>
<script src="../data.js"></script><script src="../levels.js"></script><script src="../credits.js"></script>
<script>history.replaceState(null,'','?seen&unlock');</script>
<script src="../game.js"></script>
<script>
// Replays every level's stored solution through the real tap handler (tap twice = place gear) and
// checks that the game ends in a win. Also checks that rule breaks are flagged and don't win.
const res = [];
save.mute = true; save.seen = true;
LEVELS.forEach((L, i) => {
  startLevel(i);
  L.solution.forEach(([r, c]) => { tapCell(r * L.N + c); tapCell(r * L.N + c); });
  res.push({ level: i + 1, size: L.N, tier: L.tier, won });
});
// wrong move: two gears in the same row must be flagged red and must not win
startLevel(0); const L0 = LEVELS[0], N = L0.N;
[0, 1].forEach(c => { tapCell(c); tapCell(c); });
res.push({ same_row_flagged: analyse().bad.size === 2, still_playing: !won, msg });
document.getElementById('out').textContent = JSON.stringify(res);
</script>
