<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2b3a42">
<title>Trail Pack</title>
<style>
:root{--ink:#1d2a2f;--paper:#fffaf0;--card:rgba(255,250,240,.94);--accent:#e8913a;--good:#4caf7a;--bad:#e2574c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:#2b3a42;overflow-x:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}

/* scene */
#scene{position:fixed;inset:0;z-index:-1;transition:background 1s}
#scene .ridges{position:absolute;left:0;bottom:0;width:100%;height:55%}
#scene .sun{position:absolute;top:9%;right:14%;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle,#fff8d8 30%,rgba(255,240,170,.0) 72%);box-shadow:0 0 60px 20px rgba(255,240,180,.55)}
#scene .cloud{position:absolute;font-size:56px;opacity:.85;animation:drift linear infinite;filter:drop-shadow(0 4px 6px rgba(0,0,0,.08))}
@keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(calc(100vw + 120px))}}

.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 14px 40px}
header{display:flex;align-items:center;gap:6px;margin-bottom:10px}
header h1{flex:1;margin:0;font-size:16px;line-height:1.2;min-width:0}
header h1 small{display:block;font-weight:500;opacity:.8;font-size:12px}
.btn{border:0;background:var(--card);border-radius:12px;padding:9px 12px;font-weight:700;box-shadow:0 3px 0 rgba(0,0,0,.2);min-width:42px}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);color:#fff}
.card{background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:10px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.info{font-size:13px;line-height:1.45}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:12px;background:rgba(0,0,0,.08);border-radius:99px;padding:3px 9px}
.tag.cond{background:#fff;font-weight:600}
.list{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.chip{display:flex;align-items:center;gap:4px;border-radius:99px;padding:3px 10px 3px 6px;font-size:13px;font-weight:700;background:#fff;border:2px solid transparent;transition:all .3s}
.chip.ok{background:#d9f5df;border-color:var(--good)}
.chip.q{opacity:.7}

/* pack */
.pack{display:flex;gap:10px;align-items:center}
.bag{font-size:38px}
.slots{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.slot{width:48px;height:48px;border-radius:12px;border:2px dashed rgba(0,0,0,.3);display:grid;place-items:center;font-size:24px;position:relative}
.slot.full{border:2px solid rgba(0,0,0,.25);cursor:pointer;animation:pop .35s ease-out}
.slot.bad{border-color:var(--bad);animation:shake .4s}
.slot small{position:absolute;bottom:-1px;right:3px;font-size:10px;font-weight:800}
.msg{min-height:18px;font-size:13px;font-weight:700;margin-top:8px;color:var(--bad)}

/* sacks */
.table{display:flex;flex-wrap:wrap;gap:12px 10px;justify-content:center;margin-top:20px}
.cell{display:flex;flex-direction:column;align-items:center;gap:4px;min-height:60px}
.sack{width:46px;padding:4px 3px 6px;border:3px solid rgba(255,255,255,.75);border-top:none;border-radius:4px 4px 22px 22px;background:rgba(255,255,255,.2);backdrop-filter:blur(2px);display:flex;flex-direction:column-reverse;gap:3px;cursor:pointer;transition:transform .15s,box-shadow .15s;position:relative}
.sack::before{content:"";position:absolute;left:-6px;right:-6px;top:-4px;height:5px;border-radius:4px;background:rgba(255,255,255,.75)}
.sack.sel{transform:translateY(-8px);box-shadow:0 10px 14px rgba(0,0,0,.25)}
.sack.done{border-color:#9be3b6;box-shadow:0 0 14px 2px rgba(120,230,160,.8);animation:glow 1.4s ease-in-out infinite}
.it{height:34px;border-radius:11px;display:grid;place-items:center;font-size:20px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.16),inset 0 2px 0 rgba(255,255,255,.35)}
.it.empty{background:transparent;box-shadow:none}
.it.pop{animation:pop .35s ease-out}
.sack.sel .it.top{outline:2px solid #fff;outline-offset:1px}
.tap{font-size:10px;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);height:12px}
.moves{font-size:12px;text-align:right;margin:10px 4px 0;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);font-weight:600}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes glow{50%{box-shadow:0 0 22px 5px rgba(120,230,160,.95)}}

/* overlays */
.overlay{position:fixed;inset:0;background:rgba(10,20,25,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10;overflow:auto;animation:fade .25s}
.modal{background:var(--paper);border-radius:22px;padding:20px;max-width:460px;width:100%;max-height:90vh;overflow:auto;animation:rise .3s ease-out}
.modal h2{margin:0 0 4px}
.stars{font-size:40px;letter-spacing:4px;text-align:center}
.stars span{display:inline-block;animation:pop .5s ease-out backwards}
.stars span:nth-child(2){animation-delay:.15s}.stars span:nth-child(3){animation-delay:.3s}
.how{font-size:14px;line-height:1.5;padding-left:20px;margin:8px 0 14px}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(24px);opacity:0}}
.conf{position:fixed;top:-20px;font-size:22px;z-index:20;pointer-events:none;animation:fall 2.4s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.9}}

/* home */
.hero{text-align:center;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.45);margin:10px 0 16px}
.hero h1{font-size:34px;margin:0}
.hero p{margin:4px 0 0;font-size:14px}
.trekcard{display:block;width:100%;text-align:left;border:0;border-radius:18px;padding:14px 16px;margin-bottom:12px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.45);box-shadow:0 4px 0 rgba(0,0,0,.22);position:relative;overflow:hidden}
.trekcard:active{transform:translateY(2px)}
.trekcard h3{margin:0;font-size:18px}
.trekcard p{margin:2px 0 8px;font-size:12px;opacity:.95}
.trekcard .prog{font-size:13px;font-weight:700}
.trekcard.locked{filter:grayscale(.85);opacity:.7}
.trekcard .big{position:absolute;right:12px;top:6px;font-size:42px;opacity:.9}

/* map */
.map{position:relative;border-radius:22px;background:var(--card);box-shadow:0 4px 14px rgba(0,0,0,.2);overflow:hidden}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:8px;border:0;background:none;padding:0}
.node .dot{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:18px;color:#fff;border:4px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.25);flex:none}
.node .lab{background:#fff;border-radius:10px;padding:4px 8px;font-size:12px;font-weight:700;line-height:1.2;box-shadow:0 2px 6px rgba(0,0,0,.12);max-width:128px;text-align:left}
.node .lab small{display:block;font-weight:500;opacity:.7}
.node.left{flex-direction:row-reverse}
.node.locked .dot{background:#aab !important;opacity:.8}
.node.cur .dot{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.14)}}
.hiker{position:absolute;transform:translate(-50%,-135%);font-size:26px;pointer-events:none;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{margin-top:-5px}}
.sum{position:absolute;transform:translate(-50%,-50%);font-size:34px}
</style>
</head>
<body>
<div id="scene"></div>
<div class="wrap" id="app"></div>
<div id="layer"></div>

<script>
/* ================= data ================= */
const CATS = {
  water:  {e:'💧', c:'#7cc3ee', n:'Water'},
  food:   {e:'🥜', c:'#f2b36b', n:'Food'},
  warm:   {e:'🧥', c:'#e77f7a', n:'Warm layers'},
  rain:   {e:'☔', c:'#8c9cf0', n:'Rain gear'},
  shelter:{e:'⛺', c:'#7fd1a0', n:'Shelter'},
  med:    {e:'🩹', c:'#f19bc0', n:'First aid'},
  sun:    {e:'🧴', c:'#f6dc7a', n:'Sun cream'},
  light:  {e:'🔦', c:'#b895ee', n:'Headlamp'},
  ice:    {e:'⛏️', c:'#7fe0dc', n:'Ice gear'},
  bug:    {e:'🦟', c:'#b3c47a', n:'Bug spray'}
};
// condition -> the gear it calls for (water and food are always needed)
const CONDS = {
  rain:  {t:'🌧️ Heavy rain',        gear:'rain'},
  cold:  {t:'🥶 Freezing nights',    gear:'warm'},
  sun:   {t:'☀️ Harsh sun',          gear:'sun'},
  dark:  {t:'🌙 Pre-dawn starts',    gear:'light'},
  bugs:  {t:'🦟 Jungle bugs',        gear:'bug'},
  camp:  {t:'⛺ Wild camping',       gear:'shelter'},
  remote:{t:'🚑 Far from help',      gear:'med'},
  ice:   {t:'🧊 Glacier crossing',   gear:'ice'}
};

const TREKS = {
  inca: {name:'Inca Trail', place:'Peru 🇵🇪', alt:'Max 4,215 m', icon:'🦙', sky:['#ffe2a8','#f59a6b'], ridges:['#d9946a','#a8644f','#5b3f3b'], sun:true,
    facts:['The Inca Trail ends at Machu Picchu, a citadel built in the 1400s.','Dead Woman’s Pass, at 4,215 m, is the highest point of the trek.','Only 500 people a day, porters included, are allowed on the trail.','Machu Picchu at sunrise is why most hikers start before dawn.']},
  tmb:  {name:'Tour du Mont Blanc', place:'France · Italy · Switzerland', alt:'Max 2,665 m', icon:'🏔️', sky:['#bfe4ff','#f4f9ff'], ridges:['#9fb8d4','#6f8fb5','#3c5a7e'], sun:true,
    facts:['The loop is about 170 km and crosses three countries.','Mont Blanc, at 4,805 m, is the highest peak in the Alps.','Mountain huts serve hot dinners, so you carry less than a camping trek.']},
  paine:{name:'Torres del Paine W', place:'Chile 🇨🇱', alt:'Max 900 m', icon:'🦅', sky:['#cfd9e6','#8fa5bd'], ridges:['#8aa0a0','#5f7a7c','#2f4a4f'], sun:false,
    facts:['The W trek is named after its shape on the map.','Patagonian wind can top 100 km/h.','The granite Towers rise more than 2,000 m above the valley.']},
  kili: {name:'Kilimanjaro', place:'Tanzania 🇹🇿', alt:'Max 5,895 m', icon:'🦒', sky:['#ffd37a','#e56f4a'], ridges:['#c9895a','#8d5a45','#4a3033'], sun:true,
    facts:['Kilimanjaro is the highest mountain in Africa, at 5,895 m.','You climb through five climate zones, from rainforest to arctic summit.','Guides say “pole pole”, Swahili for “slowly slowly”.']},
  ebc:  {name:'Everest Base Camp', place:'Nepal 🇳🇵', alt:'Max 5,364 m', icon:'🐂', sky:['#9fd0ff','#e9f4ff'], ridges:['#b9c8dc','#8197b3','#4a5f7d'], sun:true,
    facts:['Everest Base Camp sits at about 5,364 m.','Namche Bazaar is the Sherpa trading hub, at around 3,440 m.','Gorak Shep is the last settlement before base camp.']}
};

// reveal: 'list' = pack list shown, 'cond' = you infer the gear from the conditions
const L = (trek,title,days,conds,decoys,reveal,empties=2)=>({trek,title,days,conds,decoys,reveal,empties,
  needs:['water','food',...conds.map(c=>CONDS[c].gear)]});
const LEVELS = [
  L('inca','Day 1 · Wayllabamba',3,['rain'],[],'list'),
  L('inca','Day 2 · Dead Woman’s Pass',4,['rain','camp'],['sun'],'list'),
  L('inca','Day 3 · Cloud forest',4,['cold','camp','bugs'],['sun','light'],'list'),
  L('inca','Day 4 · Sunrise at the Sun Gate',4,['cold','dark','camp'],['sun','bug'],'cond'),
  L('tmb','Stage 1 · Les Houches',4,['sun','cold'],['bug'],'list'),
  L('tmb','Stage 3 · Col de la Seigne',5,['rain','remote'],['camp','sun'],'cond'),
  L('tmb','Stage 5 · Grand Col Ferret',5,['cold','rain','dark'],['camp','bug'],'cond'),
  L('paine','Valle Francés',5,['rain','cold'],['sun','bug','med'],'cond'),
  L('paine','Grey Glacier',6,['rain','cold','camp'],['sun','bug'],'cond'),
  L('paine','Base Torres at dawn',6,['rain','cold','camp','dark'],['sun','med'],'cond',3),
  L('kili','Machame Gate',5,['cold','remote','dark'],['bug','sun'],'cond'),
  L('kili','Barranco Wall',6,['cold','dark','sun','remote'],['bug','rain','shelter'],'cond',3),
  L('ebc','Namche Bazaar',5,['cold','remote'],['rain','sun','bug'],'cond'),
  L('ebc','Gorak Shep',6,['cold','ice','dark','remote'],['bug','rain','sun'],'cond',3)
];
const trekLevels = id => LEVELS.map((x,i)=>i).filter(i=>LEVELS[i].trek===id);

/* ================= persistence ================= */
let save = {unlocked:0, stars:{}, seen:false, mute:false};
try { Object.assign(save, JSON.parse(localStorage.getItem('trailpack')||'{}')); } catch(e){}
const persist = ()=>{ try{ localStorage.setItem('trailpack', JSON.stringify(save)); }catch(e){} };

/* ================= sound & haptics ================= */
let AC = null;
function tone(f,d,type='sine',vol=.12,delay=0){
  if(save.mute) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime+delay;
    o.type = type; o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+.02);
  }catch(e){}
}
const buzz = ms => { try{ if(!save.mute && navigator.vibrate) navigator.vibrate(ms); }catch(e){} };
const SND = {
  tap:()=>tone(620,.06,'triangle'),
  pour:()=>{tone(420,.08,'sine');tone(560,.1,'sine',.12,.07);},
  pack:()=>{tone(523,.1,'triangle');tone(784,.18,'triangle',.12,.09);buzz(15);},
  bad:()=>{tone(180,.25,'sawtooth',.08);buzz(60);},
  win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.3,'triangle',.13,i*.12))
};

/* ================= scene ================= */
const $app = document.getElementById('app'), $layer = document.getElementById('layer'), $scene = document.getElementById('scene');
const rng = s => () => (s = (s*1664525+1013904223)>>>0) / 4294967296;
function ridgeSvg(colors){
  let out = '<svg class="ridges" viewBox="0 0 1000 400" preserveAspectRatio="none">';
  colors.forEach((col,i)=>{
    const r = rng(i*77+13), base = 400-i*55, h = 190-i*45;
    let d = `M0 400 L0 ${base-h*r()}`;
    for(let x=50;x<=1000;x+=50) d += ` L${x} ${base-h*(0.25+0.75*r())}`;
    out += `<path d="${d} L1000 400Z" fill="${col}" opacity="${0.78+i*0.1}"/>`;
  });
  return out + '</svg>';
}
function setScene(id){
  const t = id ? TREKS[id] : TREKS.tmb;
  $scene.style.background = `linear-gradient(${t.sky[0]},${t.sky[1]})`;
  $scene.innerHTML = (t.sun?'<div class="sun"></div>':'') +
    '<div class="cloud" style="top:12%;animation-duration:70s">☁️</div><div class="cloud" style="top:24%;animation-duration:110s;animation-delay:-50s;font-size:42px">☁️</div>' +
    ridgeSvg(t.ridges);
}

/* ================= game state ================= */
let screen = 'home', curTrek = null, lv = 0, crates = [], sel = null, moves = 0, hist = [], won = false;
let pop = null, bad = [], msg = '';

const cap = () => LEVELS[lv].days;
const isDone = c => c.items.length===cap() && c.items.every(x=>x===c.items[0]);
const packed = () => crates.filter(c=>c.packed);

function startLevel(i){
  lv = i; curTrek = LEVELS[i].trek; screen = 'game';
  const Lv = LEVELS[i]; sel = null; moves = 0; hist = []; won = false; pop = null; bad = []; msg = '';
  const cats = [...Lv.needs, ...Lv.decoys];
  const pool = []; cats.forEach(c=>{ for(let k=0;k<Lv.days;k++) pool.push(c); });
  let tries = 0, cs;
  do {
    pool.sort(()=>Math.random()-.5);
    cs = cats.map((_,k)=>({items:pool.slice(k*Lv.days,(k+1)*Lv.days), packed:false}));
    tries++;
  } while (tries<300 && cs.some(c=>new Set(c.items).size===1));
  for(let k=0;k<Lv.empties;k++) cs.push({items:[],packed:false});
  crates = cs; setScene(Lv.trek); render();
  if(!save.seen){ save.seen = true; persist(); showHow(); }
}

const snap = () => hist.push(JSON.stringify({crates,moves}));
function undo(){
  if(!hist.length||won) return;
  const s = JSON.parse(hist.pop()); crates = s.crates; moves = s.moves; sel = null; bad = []; msg = ''; pop = null; SND.tap(); render();
}
function topGroup(c){
  let n = 0; const t = c.items[c.items.length-1];
  for(let i=c.items.length-1;i>=0 && c.items[i]===t;i--) n++;
  return n;
}
function pour(a,b){
  const A = crates[a], B = crates[b];
  if(B.packed || isDone(B) || !A.items.length) return false;
  const t = A.items[A.items.length-1];
  if(B.items.length && B.items[B.items.length-1]!==t) return false;
  const n = Math.min(topGroup(A), cap()-B.items.length);
  if(n<=0) return false;
  snap();
  for(let k=0;k<n;k++) B.items.push(A.items.pop());
  moves++; pop = {i:b,n}; return true;
}
function tap(i){
  if(won) return;
  const c = crates[i]; bad = []; msg = ''; pop = null;
  if(c.packed) return;
  if(isDone(c)){ return packCrate(i); }
  if(sel===null){ if(c.items.length){ sel = i; SND.tap(); } }
  else if(sel===i){ sel = null; SND.tap(); }
  else {
    if(pour(sel,i)){ sel = null; SND.pour(); }
    else { sel = c.items.length ? i : null; SND.tap(); }
  }
  render(); autoPackCheck();
}
function autoPackCheck(){ /* a sack that just became complete glows; the player taps it to pack */ }
function packCrate(i){
  const Lv = LEVELS[lv];
  if(won) return;
  if(packed().length>=Lv.needs.length){ msg = 'Your pack is full. Tap a packed item to take it out first.'; SND.bad(); render(); return; }
  snap(); crates[i].packed = true; sel = null; moves++; SND.pack();
  if(packed().length===Lv.needs.length) return evaluate();
  render();
}
function unpack(i){
  if(won) return; snap(); crates[i].packed = false; bad = []; msg = ''; pop = null; SND.tap(); render();
}
function evaluate(){
  const Lv = LEVELS[lv], pk = packed();
  const wrong = pk.filter(c=>!Lv.needs.includes(c.items[0]));
  if(!wrong.length){ return win(); }
  bad = wrong.map(c=>crates.indexOf(c));
  msg = `${pk.length-wrong.length} of ${Lv.needs.length} right. Tap a red item to take it out.`;
  SND.bad(); render();
}
function win(){
  won = true; render();
  const Lv = LEVELS[lv];
  const par = Lv.needs.length*4 + Lv.decoys.length*2 + 2;
  const stars = moves<=par ? 3 : moves<=par*1.6 ? 2 : 1;
  save.stars[lv] = Math.max(save.stars[lv]||0, stars);
  save.unlocked = Math.max(save.unlocked, Math.min(lv+1, LEVELS.length-1)); persist();
  SND.win(); confetti(); buzz([30,40,30]);
  setTimeout(()=>showWin(stars), 700);
}
function confetti(){
  const em = ['🎉','⭐','🥾','🏔️','✨','🎒'];
  for(let i=0;i<34;i++){
    const d = document.createElement('div'); d.className = 'conf'; d.textContent = em[i%em.length];
    d.style.left = Math.random()*100+'vw'; d.style.animationDelay = Math.random()*.8+'s'; d.style.fontSize = (16+Math.random()*18)+'px';
    document.body.appendChild(d); setTimeout(()=>d.remove(),3500);
  }
}

/* ================= rendering ================= */
const tile = (c,extra='') => `<div class="it ${extra}" style="background:${CATS[c].c}">${CATS[c].e}</div>`;

function render(){
  if(screen==='home') return renderHome();
  if(screen==='map') return renderMap();
  renderGame();
}

function renderGame(){
  const Lv = LEVELS[lv], T = TREKS[Lv.trek], pk = packed();
  const have = pk.map(c=>c.items[0]);
  const slots = Array.from({length:Lv.needs.length}, (_,k)=>{
    const c = pk[k];
    if(!c) return '<div class="slot"></div>';
    const ci = crates.indexOf(c), cat = CATS[c.items[0]];
    return `<div class="slot full ${bad.includes(ci)?'bad':''}" style="background:${cat.c}" onclick="unpack(${ci})" title="Tap to unpack">${cat.e}<small>×${Lv.days}</small></div>`;
  }).join('');
  const chips = Lv.reveal==='list'
    ? Lv.needs.map(n=>`<span class="chip ${have.includes(n)?'ok':''}">${CATS[n].e} ${CATS[n].n} ${have.includes(n)?'✓':''}</span>`).join('')
    : Lv.needs.map((n,k)=>`<span class="chip ${k<pk.length?'ok':'q'}">${k<pk.length?'🎒':'❓'}</span>`).join('');
  const sacks = crates.map((c,i)=>{
    if(c.packed) return '';
    const topN = c.items.length ? topGroup(c) : 0;
    let inner = '';
    for(let k=0;k<Lv.days;k++){
      if(!c.items[k]){ inner += '<div class="it empty"></div>'; continue; }
      const isTop = k >= c.items.length-topN;
      const isPop = pop && pop.i===i && k >= c.items.length-pop.n;
      inner += tile(c.items[k], (isTop?'top ':'')+(isPop?'pop':''));
    }
    const done = isDone(c);
    return `<div class="cell"><div class="sack ${sel===i?'sel':''} ${done?'done':''}" onclick="tap(${i})">${inner}</div><div class="tap">${done?'tap to pack':''}</div></div>`;
  }).join('');
  const hint = Lv.reveal==='list'
    ? `Pack the items on the list. Anything else is clutter.`
    : `<b>No list this time.</b> Read the conditions and work out what to pack. Water and food always go.`;
  $app.innerHTML = `
    <header>
      <button class="btn" onclick="goMap('${Lv.trek}')">←</button>
      <h1>${T.name}<small>${Lv.title}</small></h1>
      <button class="btn" onclick="undo()" ${hist.length&&!won?'':'disabled'}>↶</button>
      <button class="btn" onclick="startLevel(lv)">⟳</button>
      <button class="btn" onclick="toggleMute()">${save.mute?'🔇':'🔊'}</button>
    </header>
    <div class="card info">
      <b>${Lv.days}-day trek.</b> One sack holds ${Lv.days} of one item, one per day. ${hint}
      <div class="tags">${Lv.conds.map(c=>`<span class="tag cond">${CONDS[c].t}</span>`).join('')}<span class="tag">${T.alt}</span></div>
    </div>
    <div class="card">
      <div class="list">${chips}</div>
      <div class="pack"><div class="bag">🎒</div><div class="slots">${slots}</div></div>
      <div class="msg">${msg}</div>
    </div>
    <div class="table">${sacks}</div>
    <div class="moves">Moves: ${moves}</div>`;
}

function trekProgress(id){
  const idx = trekLevels(id), got = idx.reduce((a,i)=>a+(save.stars[i]||0),0);
  const done = idx.filter(i=>save.stars[i]).length;
  return {done, total:idx.length, got, max:idx.length*3, locked: idx[0] > save.unlocked};
}

function renderHome(){
  setScene(null);
  const cards = Object.keys(TREKS).map(id=>{
    const T = TREKS[id], p = trekProgress(id);
    return `<button class="trekcard ${p.locked?'locked':''}" style="background:linear-gradient(135deg,${T.ridges[0]},${T.ridges[2]})" ${p.locked?'onclick="shake(this)"':`onclick="goMap('${id}')"`}>
      <div class="big">${p.locked?'🔒':T.icon}</div>
      <h3>${T.name}</h3><p>${T.place} · ${T.alt}</p>
      <div class="prog">${p.locked?'Finish the previous trek to unlock':`${p.done}/${p.total} stages · ${'★'.repeat(p.got)}${'☆'.repeat(p.max-p.got)}`}</div>
    </button>`;
  }).join('');
  $app.innerHTML = `
    <div class="hero"><h1>🥾 Trail Pack</h1><p>Sort your gear. Pack smart. Hike the world’s great treks.</p></div>
    ${cards}
    <div style="display:flex;gap:8px;justify-content:center">
      <button class="btn" onclick="showHow()">How to play</button>
      <button class="btn" onclick="toggleMute()">${save.mute?'🔇 Sound off':'🔊 Sound on'}</button>
    </div>`;
}
function shake(el){ el.style.animation='shake .4s'; SND.bad(); setTimeout(()=>el.style.animation='',450); }

function renderMap(){
  const T = TREKS[curTrek], idx = trekLevels(curTrek);
  setScene(curTrek);
  const H = 130*idx.length + 110, W = 100;
  const pts = idx.map((_,k)=>({ x: 50 + (k%2===0?-18:18)*(k===0?1:1) , y: H - 70 - k*130 }));
  // smooth winding path from the trailhead through every stage up to the summit
  let d = `M50 ${H-8}`;
  const route = [{x:50,y:H-8},...pts,{x:50,y:34}];
  for(let k=1;k<route.length;k++){
    const a = route[k-1], b = route[k], my = (a.y+b.y)/2;
    d += ` C ${a.x} ${my}, ${b.x} ${my}, ${b.x} ${b.y}`;
  }
  const curIdx = idx.find(i=>!save.stars[i] && i<=save.unlocked);
  const nodes = idx.map((i,k)=>{
    const p = pts[k], locked = i>save.unlocked, st = save.stars[i]||0, isCur = i===curIdx;
    const left = p.x>50;
    const Lv = LEVELS[i];
    return `<button class="node ${left?'left':''} ${locked?'locked':''} ${isCur?'cur':''}" style="left:${p.x}%;top:${p.y}px" ${locked?'':`onclick="startLevel(${i})"`}>
      <span class="dot" style="background:${T.ridges[2]}">${locked?'🔒':k+1}</span>
      <span class="lab">${Lv.title}<small>${Lv.days} days · ${Lv.reveal==='list'?'pack list':'read conditions'}${st?' · '+'★'.repeat(st):''}</small></span>
    </button>${isCur?`<div class="hiker" style="left:${p.x}%;top:${p.y-26}px">🥾</div>`:''}`;
  }).join('');
  $app.innerHTML = `
    <header>
      <button class="btn" onclick="goHome()">←</button>
      <h1>${T.name}<small>${T.place} · ${T.alt}</small></h1>
      <button class="btn" onclick="toggleMute()">${save.mute?'🔇':'🔊'}</button>
    </header>
    <div class="map" style="height:${H}px">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="${T.ridges[1]}" stroke-width="1.6" stroke-dasharray="3 3" stroke-linecap="round" vector-effect="non-scaling-stroke" style="stroke-width:5px"/></svg>
      <div class="sum" style="left:50%;top:34px">🚩</div>
      ${nodes}
    </div>
    <div class="moves">${T.tags?'':''}Tap a stage to start packing.</div>`;
}

/* ================= overlays & nav ================= */
function overlay(html,dismiss=true){ $layer.innerHTML = `<div class="overlay" ${dismiss?'onclick="if(event.target===this)closeOverlay()"':''}><div class="modal">${html}</div></div>`; }
function closeOverlay(){ $layer.innerHTML = ''; }
function goHome(){ screen='home'; closeOverlay(); render(); window.scrollTo(0,0); }
function goMap(id){ curTrek=id; screen='map'; closeOverlay(); render(); window.scrollTo(0,0); }
function toggleMute(){ save.mute=!save.mute; persist(); if(!save.mute) SND.tap(); render(); }

function showHow(){
  overlay(`<h2>How to play</h2>
    <ol class="how">
      <li><b>Sort the sacks.</b> Tap a sack, then tap another to move its top items. You can only stack on the same item or an empty sack.</li>
      <li><b>Days = sack size.</b> A 5-day trek means 5 of each item per sack. Longer treks, bigger puzzles.</li>
      <li><b>Pack what the trek needs.</b> When a sack holds one item, it glows. Tap it to put it in your backpack, which has limited slots.</li>
      <li><b>Read the conditions.</b> Later stages hide the pack list. Rain means rain gear, freezing nights mean warm layers, and so on.</li>
    </ol>
    <button class="btn primary" style="width:100%" onclick="closeOverlay()">Got it</button>`);
}
function showWin(stars){
  const Lv = LEVELS[lv], T = TREKS[Lv.trek], idx = trekLevels(Lv.trek), k = idx.indexOf(lv);
  const lastInTrek = k===idx.length-1, lastAll = lv===LEVELS.length-1;
  const fact = T.facts[k % T.facts.length];
  overlay(`<div class="stars">${[0,1,2].map(n=>`<span>${n<stars?'⭐':'☆'}</span>`).join('')}</div>
    <h2 style="text-align:center">${lastInTrek?`${T.name} complete! 🚩`:'Pack ready!'}</h2>
    <p class="info" style="text-align:center">${Lv.title} · ${moves} moves</p>
    <div class="card info" style="background:#fff;box-shadow:none">💡 ${fact}</div>
    <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
      <button class="btn" onclick="closeOverlay();startLevel(lv)">Replay</button>
      <button class="btn" onclick="goMap('${Lv.trek}')">Map</button>
      ${lastAll?'':`<button class="btn primary" onclick="closeOverlay();${lastInTrek?`goHome()`:`startLevel(lv+1)`}">${lastInTrek?'Next trek →':'Next stage →'}</button>`}
    </div>`, false);
}

render();
</script>
</body>
</html>
